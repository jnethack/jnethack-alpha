name: build on windows

on:
  push:
    branches: [develop]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: buildmain
        run: |
          sys/winnt/nhsetup
          cd src
          nmake install

      - name: archive
        run: |
          7z a latest.zip binary/

      - name: tag
        uses: EndBug/latest-tag@latest

      - name: release
        uses: ncipollo/release-action@v1
        with:
          name: "latest"
          allowUpdates: true
          tag: latest
          commit: develop
          replacesArtifacts: true
          prerelease: true
          artifacts: ./latest.zip
